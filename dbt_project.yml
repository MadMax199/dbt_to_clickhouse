name: 'dbt_to_clickhouse'
version: '1.0.0'
config-version: 2
 
profile: 'dbt_to_clickhouse'
 
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
 
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
 
models:
  dbt_to_clickhouse:
    staging:
      +materialized: view
    marts:
      +materialized: table
 
seeds:
  dbt_to_clickhouse:
    +delimiter: ";"
    +quote_columns: false
 
    protocols:
      +column_types:
        Report_ID: String
        Household_ID: String
        Visit_Date: String
        Visit_Year: String
 
    households:
      +column_types:
        Household_ID: String